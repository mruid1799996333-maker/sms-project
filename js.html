<html>
<head>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: beige;
        }
        h1{
            text-align: center;
            color: black;
        }
        form{
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
            box-shadow: 0 0 10px rgb(0,0,0,0.1);
        }
        input[type="text"],
        input[type="password"],
        select,
        textarea{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        select{
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
            background-color: #ccc;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        textarea{
            resize: vertical;
        } 
        input[type="submit"],
        input[type="reset"],
        input[type="checkbox"]
        {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover,
        input[type="reset"]:hover,
        input[type="checkbox"]:hover
        {
            background-color: #45a049;
        }
        .error-message{
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>Register</h1>
    <form name="RegForm" onsubmit="return validateForm()" onreset="resetErrors()">
        <p>
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" placeholder="Enter your Name"/>
            <span id="name-error" class="error-message"></span>

        </p>
        <p>
            <label for="address">Address</label>
            <input type="text" id="address" name="Address" placeholder="Enter your Address"/>
            <span id="address-error" class="er0ror-message"></span>
        </p>
        <p>
            <label for="email">Email</label>
            <input type="text" id="email" name="Email" placeholder="Enter your Email"/>
            <span id="email-error" class="error-message"></span>
        </p>
        <p>
            <label for="password">Password</label>
            <input type="password" id="password" name="Password" placeholder="Enter your Password"/>
            <span id="password-error" class="error-message"></span>
        </p>
        <p>
            <label for="subject">Select Your Graduation type</label>
            <select id="subject" name="Subject">
                <option value="">Select your Graduation type</option>
                <option value="BTECH">BTECH</option>
                <option value="BBA">BBA</option>
                <option value="BSC">BSC</option>
                <option value="MSC">MSC</option>
            </select>
        </p>
        <p>
            <label for="comment">Name of College</label>
            <textarea id="comment" name="Comment" placeholder="Enter your College Name"></textarea>
        </p>
        <p>
            <input type="checkbox" id="terms" name="Terms"/>
            <label for="terms">I accept the terms and conditions</label>
            <span id="terms-error" class="error-message"></span>
        </p>
        <p>
            <input type="submit" value="Submit"/>
            <input type="reset" value="Reset"/>
        </p>
    </form>
    <script>
        function validateForm()
        {
            const name = document.getElementById("name").value;
            const address = document.getElementById("address").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const subject = document.getElementById("subject").value;
            const terms = document.getElementById("terms").checked;

            const nameError = document.getElementById("name-error");
            const addressError = document.getElementById("address-error");
            const emailError = document.getElementById("email-error");
            const passwordError = document.getElementById("password-error");
            const subjectError = document.getElementById("subject-error");
            const termsError = document.getElementById("terms-error");

            nameError.textContent="";
            addressError.textContent="";
            emailError.textContent="";
            passwordError.textContent="";
            subjectError.textContent="";
            termsError.textContent="";

            let isValid =true;
            if(name==""||/\d/.test(name))
        {
            nameError.textContent="Please enter a valid name.";
                isValid=false;
        }
        if(address=="")
        {
            addressError.textContent="Please enter your address.";
                isValid=false;
        }
            if(email==""||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
        {
            emailError.textContent="Please enter a valid email.";
                isValid=false;
        }
            if(password==""||password.length<6)
        {
            passwordError.textContent="Password must be at least 6 characters long.";
                isValid=false;
        }
            if(subject=="")
        {
            subjectError.textContent="Please select your graduation type.";
                isValid=false;
        }
            if(!terms)
        {
            termsError.textContent="You must accept the terms and conditions.";
                isValid=false;
        }
            return isValid;
            if(isValid)
            {
                alert("Form submitted successfully!");
                return true;
            }else{
                return false;
            }
        }
        function resetErrors()
        {
            document.getElementById("name-error").textContent="";
            document.getElementById("address-error").textContent="";
            document.getElementById("email-error").textContent="";
            document.getElementById("password-error").textContent="";
            document.getElementById("subject-error").textContent="";
            document.getElementById("terms-error").textContent="";
        }
    </script>
</body>

</html>
